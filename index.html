.toc button.on sup{background:rgba(255,255,255,.25);color:#fff}
.toc .tm{width:36px;padding:0;justify-content:center}
.tn{flex:1;min-width:0;font-weight:700}.tn small{color:var(--mu);margin-inline-start:6px}
.toc{align-items:flex-start}.toc .tm{align-self:flex-start;height:30px}
.trs{display:flex;flex-direction:column;gap:6px;width:max-content}.tr{display:flex;gap:8px}
.toc button{padding:5px 10px;font-size:12px}
.srch{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:0 14px;margin:6px 0 10px}
.srch input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:inherit;padding:12px 0;outline:0}
.tt{display:grid;grid-template-columns:44px 1fr 56px 40px;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--ln);cursor:pointer}
.tt.th{cursor:default;color:var(--mu);font-size:12px;font-weight:800;position:sticky;top:-18px;background:var(--cd);z-index:1}
.tt .no{color:var(--mu);font-weight:800;text-align:center}.tt .pgn{font-weight:800;color:var(--pr);text-align:center}
#rs.h{overflow-y:auto;align-items:flex-start}
#rs.f{overflow-y:auto}
#rs.f .pg{top:max(0px,calc((100% - var(--ph))/2))}
.toc{overflow:hidden}.toc .tm{flex:none}
.tsc{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}.tsc::-webkit-scrollbar{display:none}
.trs{width:auto;flex:1;min-width:0}.tr{width:max-content}
.sheet.tall{height:84%;max-height:84%;display:flex;flex-direction:column;overflow:hidden}
#tl{flex:1;min-height:0;overflow-y:auto}
.tt{grid-template-columns:64px 1fr 40px}
.tt .no{border-inline-end:1px solid var(--ln);padding:6px 0}
.tt.st .tn{color:var(--pr)}.tt i{display:block}
.board{background:var(--gl);border:1px solid var(--gb);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:24px;padding:10px 10px 8px;margin-bottom:14px;box-shadow:var(--sh)}
.bt{font-weight:800;font-size:13px;color:var(--mu);margin:0 4px 8px}
.bsc{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.bsc::-webkit-scrollbar{display:none}.bsc .bk{flex:none;width:112px}
.bn{position:absolute;top:14px;right:14px;min-width:24px;height:24px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#7c3aed);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;z-index:2;padding:0 6px;box-shadow:0 3px 8px rgba(99,102,241,.5)}
.cl{right:46px}
.ov{gap:5px;padding:7px}.ov .ob{min-height:34px;padding:3px 7px}
.mv{display:flex;gap:6px}.mv .ob{flex:1;justify-content:center;padding:0;font-size:12px}
#tl{overflow:hidden}
.tcols{flex:1;min-height:0;display:flex;flex-direction:column;--cols:72px 1fr}.tcols.c3{--cols:64px 1fr 88px}
.tch{display:grid;grid-template-columns:var(--cols);gap:10px;color:var(--mu);font-size:12px;font-weight:800;padding:4px 6px 8px;border-bottom:1px solid var(--ln);text-align:center}
.tbd{flex:1;min-height:0;display:grid;grid-template-columns:var(--cols);gap:10px}
.cl2{overflow-y:auto;min-height:0;position:relative;border-inline-end:1px solid var(--ln);padding-inline-end:4px}.cl2:last-child{border:0}
.ci{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:11px 8px;border-bottom:1px solid var(--ln);cursor:pointer;font-weight:700}
.ci small{color:var(--pr);font-weight:800;background:rgba(37,99,235,.12);border-radius:8px;padding:1px 7px}
.ci.on{background:rgba(37,99,235,.12);border-radius:10px;color:var(--pr)}
#cp .ci{justify-content:center}
.qn{margin:auto;text-align:center;font-weight:800;font-size:13px;line-height:1.45;color:#fff;padding:10px}
.bk.drag{box-shadow:0 18px 40px rgba(30,41,120,.5);opacity:.96}
.hl svg.sk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
html:not(.dk) .hl svg.sk{mix-blend-mode:multiply}
.sg svg.sk{position:absolute;inset:0;width:100%;height:100%}
.sn{max-width:100%;border-radius:10px;display:block;margin:4px 0;background:#fff}
html.nc .ah,html.nc .acc,html.nc [data-sync]{display:none}
</style>

 const b={id:uid(),t:title,n:d.numPages,c,last:0,ts:0};await idb('put','pdf:'+b.id,f);if(HV)HV.add(b.id);M.books.push(b);(M.preDone=M.preDone||[]).push(key);await save();d.destroy();URL.revokeObjectURL(u);lib()}
async function preload(){try{const r=await fetch('books/books.json',{cache:'no-store'});if(!r.ok)return;const L=await r.json();
 for(const x of L){if((M.preDone||[]).includes(x.file))continue;const rr=await fetch('books/'+encodeURIComponent(x.file));if(!rr.ok)continue;toast(tr(10));await addPdf(await rr.blob(),x.title||x.file,x.file)}}catch(e){}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
